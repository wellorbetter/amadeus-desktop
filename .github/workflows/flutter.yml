name: Flutter desktop

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-scaffold:
    name: Generate and validate Linux runner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev
      - run: flutter config --enable-linux-desktop
      - name: Generate standard Flutter Linux runner
        run: flutter create --platforms=linux --project-name timepet .
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: generated-linux-runner
          path: linux/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-linux-preview
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Test Rust activity core
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Lint Rust activity core
        run: cargo clippy --manifest-path rust/Cargo.toml -- -D warnings
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Build Windows
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  macos:
    name: Build macOS
    needs: quality
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-macos-unsigned
          path: build/macos/Build/Products/Release/Amadeus.app/
          if-no-files-found: error
